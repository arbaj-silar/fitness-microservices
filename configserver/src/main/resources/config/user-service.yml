server:
  port: 8081

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=fitness_user_DB;encrypt=true;trustServerCertificate=true
    username: spring_user
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.SQLServerDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/